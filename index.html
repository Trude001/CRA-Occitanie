<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRA Occitanie Football Américain — Calendrier & Désignations</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-dark: #0f172a;
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;

      --div-d2: #2563eb;
      --div-regional: #059669;
      --div-u18: #7c3aed;
      --div-u16: #475569;

      --unassigned-bg: #f1f5f9;
      --unassigned-border: #94a3b8;
      --unassigned-text: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.5; padding-bottom: 50px; }

    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: white;
      padding: 1.25rem 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-badge { background: #38bdf8; color: #0f172a; font-weight: 800; padding: 4px 10px; border-radius: 6px; font-size: 0.9rem; letter-spacing: 0.5px; }
    h1 { font-size: 1.3rem; font-weight: 700; }

    main { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 1.5rem; background: white; padding: 12px 20px; border-radius: 10px; border: 1px solid var(--border); }
    
    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn { background: transparent; color: var(--text-muted); border: none; font-size: 0.95rem; font-weight: 600; padding: 8px 16px; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
    .tab-btn:hover { background-color: #f1f5f9; color: var(--text-main); }
    .tab-btn.active { background-color: var(--primary); color: white; }

    .filter-group { display: flex; align-items: center; gap: 10px; }
    .filter-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    select { padding: 8px 12px; font-size: 0.9rem; border-radius: 6px; border: 1px solid var(--border); background-color: white; outline: none; }

    .view-section { display: none; }
    .view-section.active { display: block; }

    .badge-div { font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; color: white; text-transform: uppercase; }
    .badge-d2 { background-color: var(--div-d2); }
    .badge-regional { background-color: var(--div-regional); }
    .badge-u18 { background-color: var(--div-u18); }
    .badge-u16 { background-color: var(--div-u16); }

    .no-ref-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.8rem; font-weight: 600; background-color: var(--unassigned-bg); border: 1px solid var(--unassigned-border); color: var(--unassigned-text); padding: 3px 8px; border-radius: 4px; }
    .no-ref-badge svg { width: 14px; height: 14px; fill: currentColor; }

    .table-responsive { overflow-x: auto; background: white; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { background-color: #f8fafc; color: var(--text-muted); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr.row-d2 { border-left: 4px solid var(--div-d2); }
    tr.row-regional { border-left: 4px solid var(--div-regional); }
    tr.row-u18 { border-left: 4px solid var(--div-u18); }
    tr.row-u16 { border-left: 4px solid var(--div-u16); }

    .grid-matches { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem; }
    .card-match { background: white; border-radius: 10px; border: 1px solid var(--border); padding: 1.25rem; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
    .card-match.card-d2 { border-top: 5px solid var(--div-d2); }
    .card-match.card-regional { border-top: 5px solid var(--div-regional); }
    .card-match.card-u18 { border-top: 5px solid var(--div-u18); }
    .card-match.card-u16 { border-top: 5px solid var(--div-u16); }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-teams { font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; color: var(--primary-dark); }
    .card-info { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    .card-contact { background-color: #f8fafc; border-radius: 6px; padding: 8px 10px; font-size: 0.8rem; border: 1px solid var(--border); }

    @media (max-width: 768px) {
      .top-bar { flex-direction: column; align-items: stretch; }
      .nav-tabs { width: 100%; justify-content: space-between; }
      .filter-group { width: 100%; justify-content: space-between; }
      select { flex-grow: 1; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo-area">
        <span class="logo-badge">CRA</span>
        <h1>Occitanie — Football Américain - Visuel Calendrier et Désignations AP</h1>
      </div>
      <span style="font-size: 0.85rem; opacity: 0.9;">Espace répartiteurs</span>
    </div>
  </header>

  <main>
    <div class="top-bar">
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('tab-table', this)">Vue Calendrier</button>
        <button class="tab-btn" onclick="switchTab('tab-cards', this)">Vue Matchs à venir</button>
      </div>

      <div class="filter-group" id="filter-wrapper">
        <label for="ref-filter">Filtrer l'affichage :</label>
        <select id="ref-filter" onchange="applyFilter(this.value)">
          <option value="ALL">Tous les matchs</option>
          <option value="UNASSIGNED">Matchs non attribués uniquement</option>
        </select>
      </div>
    </div>

    <section id="tab-table" class="view-section active">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Statut</th>
              <th>Division</th>
              <th>Date & Heure</th>
              <th>Rencontre</th>
              <th>Lieu</th>
              <th>Arbitre Principal</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-cards" class="view-section">
      <div class="grid-matches" id="cards-container"></div>
    </section>
  </main>

  <script>
    const GOOGLE_SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRypW_JLd6gUusSfC9MG937kuKvr1sXNfbNudAI6wUnV97OPJzgMPyF37QLdUS0jin1m20_tpU0PdKs/pub?gid=1&single=true&output=csv"; 
    const GOOGLE_SHEETS_EQUIPE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRypW_JLd6gUusSfC9MG937kuKvr1sXNfbNudAI6wUnV97OPJzgMPyF37QLdUS0jin1m20_tpU0PdKs/pub?gid=642104858&single=true&output=csv";

    let matchesData = [];
    let teamsContactsMap = {};

    const iconNoRef = `
      <span class="no-ref-badge" title="Aucun arbitre désigné">
        <svg viewBox="0 0 24 24"><path d="M12 4a4 4 0 0 1 4 4c0 1.95-1.39 3.58-3.25 3.93l4.57 4.57C19.1 17.27 20 18.53 20 20h-2c0-1.1-.6-2.1-1.55-2.65l-2.22-2.22C13.56 15.7 12.8 16 12 16c-2.21 0-4-1.79-4-4 0-.8.3-1.56.87-2.23L2.1 3.51l1.41-1.41 18.38 18.38-1.41 1.41L14.1 15.5C13.43 15.82 12.73 16 12 16c-4.42 0-8 2.24-8 5H2c0-3.52 4.48-6 10-6 .83 0 1.64.07 2.41.21l-2.07-2.07C12.11 13.19 12.06 13.2 12 13.2c-2.87 0-5.2-2.33-5.2-5.2 0-.28.03-.55.08-.82L2.1 2.41 3.51 1h.01l18.38 18.38-1.41 1.41-5.32-5.32C13.9 15.82 12.98 16 12 16z"/></svg>
        Non attribué
      </span>`;

    function splitCSVLines(text) {
      return text.trim().split('\n').map(l => l.trim()).filter(l => l.length > 0);
    }

    function formatPhoneNumber(rawTel) {
      if (!rawTel || rawTel === "#N/A") return "";
      let str = rawTel.toString().trim();
      if (str.includes('e') || str.includes('E')) {
        let num = Number(str);
        if (!isNaN(num)) str = Math.round(num).toString();
      }
      let cleaned = str.replace(/\D/g, '');
      if (cleaned.length === 9 && !cleaned.startsWith('0')) cleaned = '0' + cleaned;
      if (cleaned.length === 10) return cleaned.replace(/(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/, '$1 $2 $3 $4 $5');
      return rawTel;
    }

    function parseEquipesCSV(csvText) {
      const lines = splitCSVLines(csvText);
      if (lines.length < 2) return {};
      const map = {};
      const headers = lines[0].split(',').map(h => h.trim().replace(/^"(.*)"$/, '$1').replace(/^﻿/, '').toLowerCase());

      let teamColIdx = 0, nameColIdx = -1, mailColIdx = -1, telColIdx = -1;
      headers.forEach((h, idx) => {
        if (h.includes('equipe') || h.includes('club')) teamColIdx = idx;
        else if (h.includes('contact') || h.includes('personne') || h.includes('responsable')) nameColIdx = idx;
        else if (h.includes('mail') || h.includes('courriel')) mailColIdx = idx;
        else if (h.includes('tel') || h.includes('telephone')) telColIdx = idx;
      });

      for (let i = 1; i < lines.length; i++) {
        const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.trim().replace(/^"(.*)"$/, '$1'));
        if (row.length <= teamColIdx) continue;
        const teamName = row[teamColIdx];
        if (!teamName || teamName === "#N/A") continue;

        map[teamName.toLowerCase()] = {
          nom: (nameColIdx !== -1 && row[nameColIdx] !== "#N/A") ? row[nameColIdx] : "",
          mail: (mailColIdx !== -1 && row[mailColIdx] !== "#N/A") ? row[mailColIdx] : "",
          tel: formatPhoneNumber((telColIdx !== -1 && row[telColIdx] !== "#N/A") ? row[telColIdx] : "")
        };
      }
      return map;
    }

    function getTeamContactHtml(teamName) {
      if (!teamName) return "<em>Non renseigné</em>";
      const cleanName = teamName.toLowerCase().trim();
      const words = cleanName.replace(/[^a-z0-9\s]/gi, '').split(' ').filter(w => w.length > 2 && w !== 'mfa');

      let foundKey = Object.keys(teamsContactsMap).find(k => k === cleanName || words.some(w => k.includes(w)));
      let contactName = "Non désigné", mailStr = "Mail non renseigné", telStr = "Tel non renseigné";

      if (foundKey) {
        const c = teamsContactsMap[foundKey];
        if (c.nom) contactName = c.nom;
        if (c.mail) mailStr = `<a href="mailto:${c.mail}">${c.mail}</a>`;
        if (c.tel) telStr = c.tel;
      }
      return `<strong>${teamName}</strong> : 👤 ${contactName} | ✉️ ${mailStr} | 📞 ${telStr}`;
    }

    function parseCalendrierCSV(text) {
      const lines = splitCSVLines(text);
      if (lines.length < 2) return [];
      const headers = lines[0].split(',').map(h => h.trim().replace(/^"(.*)"$/, '$1').replace(/^﻿/, ''));
      const data = [];

      for (let i = 1; i < lines.length; i++) {
        const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.trim().replace(/^"(.*)"$/, '$1'));
        if (row.length < headers.length) continue;

        let obj = {};
        headers.forEach((h, index) => { obj[h] = row[index] || ""; });

        if (obj['Locaux'] && obj['Locaux'] !== "#N/A" && obj['Locaux'] !== "Locaux") {
          data.push({
            id: i,
            division: obj['Division'] || "D2",
            home: obj['Locaux'],
            away: obj['Visiteurs'] || "",
            date: obj['Date'] || "",
            time: obj['Heure Kick-off'] || "",
            stadium: obj['Lieu rencontre'] === "#N/A" ? "Stade non renseigné" : (obj['Lieu rencontre'] || "Stade non renseigné"),
            referee: obj['Arbitre désigné'] === "#N/A" ? "" : (obj['Arbitre désigné'] || "")
          });
        }
      }
      return data;
    }

    function getDivisionClass(div) {
      switch(div.toUpperCase()) {
        case 'D2': return 'd2';
        case 'RÉGIONAL':
        case 'REGIONAL': return 'regional';
        case 'U18': return 'u18';
        case 'U16': return 'u16';
        default: return 'd2';
      }
    }

    function populateRefFilter() {
      const select = document.getElementById('ref-filter');
      select.innerHTML = `<option value="ALL">Tous les matchs</option><option value="UNASSIGNED">Matchs non attribués uniquement</option>`;
      const referees = new Set();
      matchesData.forEach(m => { if (m.referee) referees.add(m.referee.trim()); });
      referees.forEach(ref => {
        const opt = document.createElement('option');
        opt.value = ref;
        opt.textContent = `Arbitre : ${ref}`;
        select.appendChild(opt);
      });
    }

    function renderViews(filteredMatches) {
      const tableBody = document.getElementById('table-body');
      const cardsContainer = document.getElementById('cards-container');
      tableBody.innerHTML = '';
      cardsContainer.innerHTML = '';

      if (filteredMatches.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 20px; color: var(--text-muted);">Aucun match trouvé.</td></tr>`;
        return;
      }

      filteredMatches.forEach(m => {
        const divClass = getDivisionClass(m.division);
        const hasRef = m.referee && m.referee.trim() !== "";
        const refDisplay = hasRef ? `<strong>${m.referee}</strong>` : iconNoRef;

        const tr = document.createElement('tr');
        tr.className = `row-${divClass}`;
        tr.innerHTML = `
          <td>${hasRef ? '<span style="color:var(--div-regional); font-weight:bold;">✔ Affecté</span>' : iconNoRef}</td>
          <td><span class="badge-div badge-${divClass}">${m.division}</span></td>
          <td><strong>${m.date}</strong><br><small>${m.time}</small></td>
          <td><strong>${m.home}</strong> vs <strong>${m.away}</strong></td>
          <td>${m.stadium}</td>
          <td>${refDisplay}</td>
        `;
        tableBody.appendChild(tr);

        const card = document.createElement('div');
        card.className = `card-match card-${divClass}`;
        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="badge-div badge-${divClass}">${m.division}</span>
              ${hasRef ? '' : iconNoRef}
            </div>
            <div class="card-teams">${m.home} <span style="font-weight: normal; font-size: 0.85rem; color: var(--text-muted);">VS</span> ${m.away}</div>
            <div class="card-info">
              <span>📅 ${m.date} à ${m.time}</span>
              <span>📍 Stade : ${m.stadium}</span>
              <span>🏁 Arbitre : ${hasRef ? `<strong>${m.referee}</strong>` : '<em>Non désigné</em>'}</span>
            </div>
          </div>
          <div class="card-contact">
            <div style="font-weight:600; margin-bottom:4px;">Contacts des équipes :</div>
            <div style="margin-bottom: 4px;">${getTeamContactHtml(m.home)}</div>
            <div>${getTeamContactHtml(m.away)}</div>
          </div>
        `;
        cardsContainer.appendChild(card);
      });
    }

    function applyFilter(value) {
      let filtered = matchesData;
      if (value === 'UNASSIGNED') filtered = matchesData.filter(m => !m.referee || m.referee.trim() === "");
      else if (value !== 'ALL') filtered = matchesData.filter(m => m.referee === value);
      renderViews(filtered);
    }

    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }

    async function loadCalendarData() {
      try {
        const respEquipes = await fetch(GOOGLE_SHEETS_EQUIPE_URL);
        if (respEquipes.ok) teamsContactsMap = parseEquipesCSV(await respEquipes.text());

        const response = await fetch(GOOGLE_SHEETS_CSV_URL);
        if (!response.ok) throw new Error("Erreur réseau HTTP");
        
        matchesData = parseCalendrierCSV(await response.text());
      } catch (err) {
        console.error("Impossible de charger Google Sheets", err);
        document.getElementById('table-body').innerHTML = `<tr><td colspan="6" style="text-align:center; color:red; padding: 20px;">Erreur de chargement des données. Vérifiez que vos Google Sheets sont bien publiés sur le web au format CSV.</td></tr>`;
      } finally {
        populateRefFilter();
        renderViews(matchesData);
      }
    }

    document.addEventListener('DOMContentLoaded', loadCalendarData);
  </script>
</body>
</html>
